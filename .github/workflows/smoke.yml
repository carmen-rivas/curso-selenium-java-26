name: Smoke Tests — PR Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:        # permite dispararlo manualmente desde Actions

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven          # cachea ~/.m2 — de 3-4 min a 30-60 s

      - name: Ejecutar smoke tests (headless)
        run: mvn test -Denv=ci '-Dsurefire.suiteXmlFiles=smoke.xml'

      - name: Generar reporte Allure
        if: always()            # incluso si los tests fallaron
        run: mvn allure:report

      - name: Subir reporte Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-smoke-${{ github.run_number }}
          path: target/site/allure-maven-plugin/
          retention-days: 7

      - name: Subir resultados de Surefire
        if: failure()           # solo si algo falló
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_number }}
          path: target/surefire-reports/
